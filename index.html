<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#f6f6f4">
		<link rel="manifest" href="./manifest.json">
		<title>Challenge Task</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
		    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
		<style>
			:root {
				color-scheme: light;
				font-family: 'Inter', sans-serif;
				background: #f6f6f4;
				color: #1c1c1a;
				--muted: #8f8f8a;
				--accent: #78b7d0;
				--success: #77c9a5;
			}

			* { box-sizing: border-box; }

			body {
				min-height: 100vh;
				margin: 0;
				padding: 32px 20px 48px;
				-webkit-font-smoothing: antialiased;
			}

			main {
				max-width: 440px;
				margin: 0 auto;
			}

			[hidden] { display: none !important; }
			h1 { margin: 0 0 24px; font-size: 21px; font-weight: 500; }
			h2 { margin: 0 0 16px; font-size: 18px; font-weight: 500; }

			.hero {
				padding: 20px 18px;
				border-radius: 8px;
				background: #e8f4f8;
			}

			.hero-title {
				margin: 0 0 20px;
				font-size: clamp(26px, 8vw, 34px);
				font-weight: 600;
				line-height: 1.15;
			}

			button {
				width: 100%;
				min-height: 46px;
				border: 0;
				border-radius: 6px;
				background: #1c1c1a;
				color: #fff;
				font: 500 15px 'Inter', sans-serif;
				cursor: pointer;
			}

			button:hover { background: #383836; }
			button:focus-visible { outline: 2px solid #1c1c1a; outline-offset: 3px; }
			button:disabled {
				cursor: not-allowed;
				color: var(--muted);
				background: #e8e8e5;
			}

			#complete-button {
				background: var(--accent);
				color: #fff;
			}

			#complete-button:hover { background: #5fa5ba; }

			.secondary-button {
				margin-top: 12px;
				background: transparent;
				border: 1px solid #1c1c1a;
				color: #1c1c1a;
			}

			.secondary-button:hover { background: rgba(28, 28, 26, 0.08); }

			.small-button {
				display: inline-block;
				width: auto;
				min-height: 0;
				padding: 0;
				background: none;
				color: #1c1c1a;
				font-size: 14px;
			}

			.small-button:hover:not(:disabled) { background: none; text-decoration: underline; }

			.completion-message:empty { display: none; }
			.completion-message {
				margin: 0 0 16px;
				padding: 20px 18px;
				border-radius: 8px;
				background: #e8f9f3;
				color: var(--success);
				font-weight: 600;
				line-height: 1.4;
			}

			.account {
				margin: 0 0 24px 0;
				padding: 12px 14px;
				border: 1px solid #e8e8e5;
				border-radius: 8px;
				background: #fff;
			}

			.sync-row { display: flex; align-items: center; gap: 8px; }

			.account label {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			.account input {
				flex: 1;
				width: 0;
				min-width: 0;
				min-height: 0;
				margin: 0;
				padding: 8px 9px;
				border: 1px solid #e8e8e5;
				border-radius: 5px;
				color: var(--muted);
				font: 13px 'Inter', sans-serif;
			}

			.account .sync-button {
				width: auto;
				min-height: 0;
				padding: 0;
				border: 0;
				border-radius: 0;
				background: none;
				color: var(--muted);
				font: 13px 'Inter', sans-serif;
				white-space: nowrap;
			}

			.account .sync-button:hover:not(:disabled) { background: none; color: #1c1c1a; }

			.account p { margin: 0; font-size: 14px; overflow-wrap: anywhere; }

			#account-status:empty { display: none; }
			#account-status { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.4; }

			.task-section {
				margin: 24px 0;
				padding: 20px 18px;
				border-radius: 8px;
				background: #fff;
				border: 1px solid #e8e8e5;
			}

			.task-input-group {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			.task-input-group input {
				flex: 1;
				min-height: 44px;
				padding: 10px 12px;
				border: 1px solid #e8e8e5;
				border-radius: 6px;
				font: 14px 'Inter', sans-serif;
				color: #1c1c1a;
			}

			.task-input-group button {
				width: auto;
				min-width: 100px;
				padding: 0 16px;
			}

			.task-display {
				margin-bottom: 16px;
			}

			.task-subtitle {
				margin: 0 0 16px;
				color: var(--muted);
				font-size: 14px;
			}

			.task-info-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 16px;
				gap: 12px;
			}

			.week-indicator {
				display: flex;
				gap: 4px;
				align-items: center;
				flex: 1;
			}

			.week-day {
				width: 20px;
				height: 20px;
				border-radius: 50%;
				background: #ccc9c5;
				border: 1px solid transparent;
				flex-shrink: 0;
			}

			.week-day.today {
				background: #ccc9c5;
				border: 2px solid #1c1c1a;
			}

			.week-day.past {
				background: transparent;
				border: 1.5px solid #9f9b97;
			}

			.task-text {
				margin: 0 0 12px;
				font-size: 18px;
				font-weight: 500;
				line-height: 1.4;
				word-wrap: break-word;
			}

			.task-status {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 12px;
				padding: 10px 12px;
				border-radius: 6px;
				background: #f6f6f4;
			}

			.status-icon {
				font-size: 20px;
				flex-shrink: 0;
			}

			.status-text {
				font-size: 14px;
				color: var(--muted);
			}

			.status-text.completed {
				color: var(--success);
				font-weight: 500;
			}

			.status-subtext {
				font-size: 12px;
				color: var(--muted);
			}

			.check-in-list {
				margin-bottom: 16px;
				padding-top: 12px;
				border-top: 1px solid #e8e8e5;
			}

			.check-in-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 8px;
				padding: 8px 0;
				font-size: 13px;
				border-bottom: 1px solid #f0f0ed;
			}

			.check-in-item:last-child {
				border-bottom: none;
			}

			.check-in-time {
				color: var(--muted);
			}

			.check-in-actions button {
				width: auto;
				min-height: 0;
				padding: 2px 6px;
				font-size: 12px;
				background: #f0f0ed;
				color: #1c1c1a;
				border-radius: 3px;
			}

			.check-in-actions button:hover { background: #e8e8e5; }

			.button-group {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
				margin-top: 16px;
			}

			.button-group button { margin: 0; }
			.button-group .secondary-button { margin-top: 0; }

			.empty-state {
				text-align: center;
				padding: 20px;
				color: var(--muted);
			}

			.empty-state p {
				margin: 0;
				font-size: 14px;
				line-height: 1.5;
			}

			.history-section {
				margin-top: 32px;
			}

			.history-section h2 {
				margin-bottom: 16px;
				font-size: 18px;
				font-weight: 500;
			}

			.week-item {
				margin-bottom: 16px;
				padding: 12px 14px;
				border: 1px solid #e8e8e5;
				border-radius: 6px;
				background: #fff;
				font-size: 14px;
			}

			.week-date {
				color: var(--muted);
				font-size: 12px;
				margin-bottom: 4px;
			}

			.week-task {
				margin-bottom: 8px;
				word-wrap: break-word;
			}

			.week-status {
				color: var(--success);
				font-weight: 500;
			}

			.week-status.incomplete {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<section class="account" aria-label="Account">
				<form id="sign-in-form" class="sync-row">
					<label for="email">Email</label>
					<input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
					<button class="sync-button" id="sign-in-button" type="submit">Sign in</button>
				</form>
				<div class="sync-row" id="signed-in-account" hidden>
					<p id="account-email"></p>
					<button class="sync-button" id="sign-out-button" type="button">Sign out</button>
				</div>
				<p id="account-status" role="status" aria-live="polite"></p>
			</section>

			<p class="completion-message" id="completion-message" role="status" aria-live="polite"></p>

			<section class="hero" id="hero-section">
				<p class="hero-title">Set your challenge for this week</p>
				<p style="margin: 0 0 20px; color: var(--muted); font-size: 14px;">One task to complete before Sunday</p>
			</section>

			<section class="task-section">
				<div class="task-display" id="task-display" hidden>
					<p class="task-text" id="task-text"></p>
					<div class="task-info-row">
						<div class="week-indicator" id="week-indicator"></div>
						<div class="task-status" id="task-status"></div>
					</div>
					<div class="button-group">
						<button id="complete-button" type="button">Mark complete</button>
						<button class="secondary-button" id="undo-complete-button" type="button" hidden>Undo</button>
					</div>
				</div>

				<div id="task-input-display">
					<div class="task-input-group">
						<input 
							id="task-input" 
							type="text" 
							placeholder="What's your challenge this week?" 
							maxlength="200"
							aria-label="Weekly challenge"
						>
						<button id="set-task-button" type="button">Set</button>
					</div>
					<p id="char-count" style="font-size: 12px; color: var(--muted); margin: 0;"></p>
				</div>

				<div class="empty-state" id="empty-state" hidden>
					<p>No challenge set yet. Add one above to get started.</p>
				</div>
			</section>

			<section class="history-section">
				<h2>Challenge history</h2>
				<div id="history-list"></div>
				<div class="empty-state" id="history-empty" hidden>
					<p>No previous challenges. Set your first one above.</p>
				</div>
			</section>
		</main>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
		<script>
			const SUPABASE_URL = 'https://uucsqoehpahdxspxwcug.supabase.co';
			const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3AfYWxszM3n3nTi3mhZNcQ_I2hOTlD6';
			const configured = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_PUBLISHABLE_KEY !== 'YOUR_SUPABASE_PUBLISHABLE_KEY';
			const db = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

			if (location.protocol !== 'file:' && 'serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('./sw.js').catch(error => {
						console.error('Service worker registration failed:', error);
					});
				});
			}

			// DOM Elements
			const signInForm = document.getElementById('sign-in-form');
			const signInButton = document.getElementById('sign-in-button');
			const signOutButton = document.getElementById('sign-out-button');
			const accountEmail = document.getElementById('account-email');
			const accountStatus = document.getElementById('account-status');
			const completionMessage = document.getElementById('completion-message');
			const taskInput = document.getElementById('task-input');
			const setTaskButton = document.getElementById('set-task-button');
			const taskDisplay = document.getElementById('task-display');
			const taskInputDisplay = document.getElementById('task-input-display');
			const taskText = document.getElementById('task-text');
			const taskStatus = document.getElementById('task-status');
			const weekIndicator = document.getElementById('week-indicator');
			const completeButton = document.getElementById('complete-button');
			const undoCompleteButton = document.getElementById('undo-complete-button');
			const heroSection = document.getElementById('hero-section');
			const historyList = document.getElementById('history-list');
			const historyEmpty = document.getElementById('history-empty');
			const charCount = document.getElementById('char-count');

			// State
			let user = null;
			let currentWeekTask = null;
			let pastTasks = [];
			let loading = true;
			let saving = false;
			let completionMessageTimeout = null;
			let countdownInterval = null;

			// Get the Sunday of the current week (week starts Sunday)
			function getSundayOfWeek(date = new Date()) {
				const d = new Date(date);
				const day = d.getDay();
				const diff = d.getDate() - day;
				return new Date(d.setDate(diff));
			}

			// Format date for database
			function formatDateForDb(date) {
				return date.toISOString().split('T')[0];
			}

			// Update character count
			taskInput.addEventListener('input', () => {
				const remaining = 200 - taskInput.value.length;
				charCount.textContent = remaining >= 0 ? `${remaining} characters remaining` : 'Character limit exceeded';
			});

			function setCompletionMessage(message = '') {
				clearTimeout(completionMessageTimeout);
				completionMessage.textContent = message;
				completionMessageTimeout = message ? setTimeout(() => {
					completionMessage.textContent = '';
					completionMessageTimeout = null;
				}, 5000) : null;
			}

			function updateResetCountdown() {
				if (!currentWeekTask) return;
				updateTaskStatus();
			}

			function renderWeekIndicator() {
				weekIndicator.replaceChildren();
				
				const today = new Date();
				today.setHours(0, 0, 0, 0);
				
				const weekStart = new Date(getSundayOfWeek());
				weekStart.setHours(0, 0, 0, 0);
				
				const weekEnd = new Date(weekStart);
				weekEnd.setDate(weekEnd.getDate() + 7);
				
				for (let i = 0; i < 7; i++) {
					const dayDate = new Date(weekStart);
					dayDate.setDate(dayDate.getDate() + i);
					
					const circle = document.createElement('div');
					circle.className = 'week-day';
					
					if (dayDate.getTime() === today.getTime()) {
						circle.classList.add('today');
					} else if (dayDate < today) {
						circle.classList.add('past');
					}
					
					weekIndicator.append(circle);
				}
			}

			function renderCheckIns() {
				// Check-ins removed - feature simplified
			}

			function updateTaskStatus() {
				if (!currentWeekTask) return;
				
				if (currentWeekTask.completed_at) {
					// Hide normal display
					taskText.hidden = true;
					weekIndicator.style.display = 'none';
					
					// Show completion message
					taskStatus.style.display = 'flex';
					taskStatus.style.flexDirection = 'column';
					taskStatus.style.alignItems = 'flex-start';
					taskStatus.style.padding = '16px 12px';
					taskStatus.style.background = '#e8f9f3';
					taskStatus.replaceChildren();
					
					const mainText = document.createElement('div');
					mainText.className = 'status-text completed';
					mainText.style.fontSize = '18px';
					mainText.style.marginBottom = '8px';
					mainText.textContent = currentWeekTask.task_description + ' done';
					
					const subText = document.createElement('div');
					subText.className = 'status-subtext';
					subText.textContent = 'Done until Sunday';
					
					taskStatus.append(mainText, subText);
					completeButton.disabled = true;
					completeButton.textContent = 'Completed';
					undoCompleteButton.hidden = false;
				} else {
					// Show normal display
					taskText.hidden = false;
					weekIndicator.style.display = 'flex';
					taskStatus.style.display = 'none';
					
					completeButton.disabled = false;
					completeButton.textContent = 'Mark complete';
					undoCompleteButton.hidden = true;
					
					renderWeekIndicator();
				}
			}

			function renderTask() {
				if (!currentWeekTask) {
					taskDisplay.hidden = true;
					taskInputDisplay.hidden = false;
					heroSection.hidden = false;
					return;
				}

				taskInputDisplay.hidden = true;
				taskDisplay.hidden = false;
				heroSection.hidden = true;
				taskText.textContent = currentWeekTask.task_description;
				
				updateTaskStatus();
			}

			function renderHistory() {
				historyList.replaceChildren();
				if (pastTasks.length === 0) {
					historyEmpty.hidden = false;
					return;
				}

				historyEmpty.hidden = true;
				for (const task of pastTasks) {
					const item = document.createElement('div');
					item.className = 'week-item';
					
					const date = document.createElement('div');
					date.className = 'week-date';
					date.textContent = 'Week of ' + new Date(task.week_start).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
					
					const taskEl = document.createElement('div');
					taskEl.className = 'week-task';
					taskEl.textContent = task.task_description;
					
					const status = document.createElement('div');
					status.className = 'week-status' + (task.completed_at ? '' : ' incomplete');
					status.textContent = task.completed_at ? '✓ Completed' : '◯ Not completed';
					
					item.append(date, taskEl, status);
					historyList.append(item);
				}
			}

			function renderUI() {
				setTaskButton.disabled = !user || loading || saving;
				completeButton.disabled = !user || loading || saving || !currentWeekTask || currentWeekTask.completed_at;
				undoCompleteButton.disabled = !user || loading || saving;
				signOutButton.disabled = saving;
				renderTask();
				renderHistory();
				updateResetCountdown();
			}

			async function loadWeekData() {
				if (!user) return;

				loading = true;
				accountStatus.textContent = 'Loading challenge...';
				renderUI();

				try {
					const sundayStr = formatDateForDb(getSundayOfWeek());

					// Load current week task
					const { data: taskData, error: taskError } = await db.from('weekly_tasks')
						.select('*')
						.eq('user_id', user.id)
						.eq('week_start', sundayStr)
						.single();

					if (taskError && taskError.code !== 'PGRST116') throw taskError;
					currentWeekTask = taskData || null;

					// Load past tasks
					const { data: pastData, error: pastError } = await db.from('weekly_tasks')
						.select('*')
						.eq('user_id', user.id)
						.lt('week_start', sundayStr)
						.order('week_start', { ascending: false })
						.limit(12);

					if (pastError) throw pastError;
					pastTasks = pastData || [];

					accountStatus.textContent = '';
				} catch (error) {
					accountStatus.textContent = `Could not load challenge: ${error.message}`;
				} finally {
					loading = false;
					renderUI();
				}
			}

			if (db) {
				db.auth.onAuthStateChange((_event, session) => {
					const nextUser = session?.user || null;
					if (nextUser?.id === user?.id) return;
					
					user = nextUser;
					currentWeekTask = null;
					pastTasks = [];
					loading = !!user;

					signInForm.hidden = !!user;
					document.getElementById('signed-in-account').hidden = !user;
					accountEmail.textContent = user?.email || '';
					accountStatus.textContent = user ? '' : 'Sign in to save your challenges.';
					
					renderUI();
					if (user) setTimeout(loadWeekData, 0);
				});
			} else {
				loading = false;
				signInButton.disabled = true;
				accountStatus.textContent = configured ? 'Could not load Supabase. Check your connection.' : 'Set your Supabase URL and publishable key to enable sign-in.';
			}

			renderUI();

			// Sign in
			signInForm.addEventListener('submit', async event => {
				event.preventDefault();
				if (!db) return;
				signInButton.disabled = true;
				accountStatus.textContent = 'Sending sign-in link...';
				const { error } = await db.auth.signInWithOtp({
					email: document.getElementById('email').value.trim(),
					options: { emailRedirectTo: location.origin + location.pathname }
				});
				accountStatus.textContent = error ? `Could not send link: ${error.message}` : 'Check your email for a sign-in link.';
				signInButton.disabled = false;
			});

			// Sign out
			signOutButton.addEventListener('click', async () => {
				signOutButton.disabled = true;
				const { error } = await db.auth.signOut();
				if (error) accountStatus.textContent = `Could not sign out: ${error.message}`;
				signOutButton.disabled = false;
			});

			// Set task
			setTaskButton.addEventListener('click', async () => {
				const taskDesc = taskInput.value.trim();
				if (!taskDesc || !user || loading || saving) return;

				saving = true;
				renderUI();
				accountStatus.textContent = 'Setting challenge...';

				try {
					const sundayStr = formatDateForDb(getSundayOfWeek());
					
					if (currentWeekTask) {
						// Update existing task
						const { error } = await db.from('weekly_tasks')
							.update({ task_description: taskDesc })
							.eq('id', currentWeekTask.id)
							.eq('user_id', user.id);
						
						if (error) throw error;
						currentWeekTask.task_description = taskDesc;
					} else {
						// Create new task
						const { data, error } = await db.from('weekly_tasks')
							.insert({
								user_id: user.id,
								week_start: sundayStr,
								task_description: taskDesc,
								completed_at: null
							})
							.select()
							.single();
						
						if (error) throw error;
						currentWeekTask = data;
						checkIns = [];
					}

					taskInput.value = '';
					charCount.textContent = '';
					accountStatus.textContent = '';
					setCompletionMessage('Challenge set for this week!');
					renderUI();
				} catch (error) {
					accountStatus.textContent = `Could not set challenge: ${error.message}`;
					saving = false;
					renderUI();
				}
			});

			// Mark complete
			completeButton.addEventListener('click', async () => {
				if (!user || loading || saving || !currentWeekTask) return;

				saving = true;
				renderUI();
				accountStatus.textContent = 'Marking complete...';

				try {
					const { error } = await db.from('weekly_tasks')
						.update({ completed_at: new Date().toISOString() })
						.eq('id', currentWeekTask.id)
						.eq('user_id', user.id);

					if (error) throw error;
					currentWeekTask.completed_at = new Date().toISOString();
					accountStatus.textContent = '';
					setCompletionMessage('Challenge completed! Great work!');
					renderUI();
				} catch (error) {
					accountStatus.textContent = `Could not mark complete: ${error.message}`;
					saving = false;
					renderUI();
				}
			});

			// Undo completion
			undoCompleteButton.addEventListener('click', async () => {
				if (!user || loading || saving || !currentWeekTask) return;

				saving = true;
				renderUI();
				accountStatus.textContent = 'Undoing completion...';

				try {
					const { error } = await db.from('weekly_tasks')
						.update({ completed_at: null })
						.eq('id', currentWeekTask.id)
						.eq('user_id', user.id);

					if (error) throw error;
					currentWeekTask.completed_at = null;
					accountStatus.textContent = '';
					setCompletionMessage('Completion undone');
					renderUI();
				} catch (error) {
					accountStatus.textContent = `Could not undo: ${error.message}`;
					saving = false;
					renderUI();
				}
			});

			// Update countdown every minute
			countdownInterval = setInterval(() => {
				updateResetCountdown();
			}, 60000);

			// Clean up on page unload
			window.addEventListener('beforeunload', () => {
				clearInterval(countdownInterval);
			});
		</script>
	</body>
</html>
